# Licensed music beds for the studio. Files live in assets/music/ (git-ignored audio; this ledger is the record).
# Allowed sources: pixabay (Pixabay Content Licence, record the track page URL and download date) or cc0.
# NEVER add YouTube Audio Library tracks: they are YouTube-only and reels use the same mix. The studio refuses them.
# With no track present the studio generates a CC0 pad in-house (zero cost).
# tracks:
#   - id: pixabay-12345
#     file: calm-markets.mp3
#     title: Calm Markets
#     artist: Some Artist
#     source: pixabay
#     licence: Pixabay Content Licence
#     licence_url: https://pixabay.com/service/license-summary/
#     source_url: https://pixabay.com/music/...
#     downloaded: 2026-11-09
#     sha256: <64 hex, optional; verified when the file is present>
#     mood: [policy, commodities]     # matched against the first scene's palette
# Owner downloaded these on 2026-11-09 from Pixabay Music (page 403s to automated access, so source_url is the download URL the
# owner's browser recorded; the track page is pixabay.com/music/ with the numeric id in the id field). Titles come from the file names.
# Order matters: with no mood match the first present track is used, so the calmest comes first.
# Audio files are git-ignored. Master copies sit in the private R2 bucket ullaslab-private under assets/music/<file>; the studio fetches
# any missing one (R2_* env keys, else wrangler login) and verifies the sha256 below.
