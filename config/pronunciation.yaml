# Pronunciation list for ENGLISH narration: how a short form is SPOKEN (owner rule 2026-11-13: every short form meant to be read
# letter by letter is spoken as letters, "U.S." and "US" as "U S", never as the word "us").
#
# letters: initialisms read letter by letter. Key = how it is written in the script, value = how it is spoken. A key with periods
#   ("U.S.") also gets its bare form ("US"), and every key also gets its plural ("ETFs", "ETF's"), all spoken as letters. A dotted
#   form at the very end of a text keeps its sentence stop.
# words: acronyms spoken as a word (OPEC, NATO) and currency/unit codes expanded to words (USD). Spoken as listed, never spelled.
#
# Generic public initialisms only (no script text, no item data). The same list is kept in the private content repo
# (config/pronunciation.yaml, which gates the scripts); tests/test_pronunciation.py compares the two when ULLASLAB_CONTENT_DIR
# points at a content checkout. Keep `say` as plain words or spaced capitals: the A3 WER gate compares the ASR transcript with the
# script after canonicalisation (wer_norm), which treats "U.S.", "US" and "U S" alike. Override the file with ULLASLAB_PRONUNCIATION.
version: 1
letters:
  "U.S.": "U S"
  "U.K.": "U K"
  "E.U.": "E U"
  "U.N.": "U N"
  "U.A.E.": "U A E"
