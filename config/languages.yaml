# 13 languages. Source of truth for translator, TTS adapters, captions and dubbing.
# TTS verdicts from docs/feasibility.md (verified 2026-11-08).
#   tts_engine: chatterbox (MIT, voice clone), indic_parler (Apache-2.0, stock voice),
#               kokoro (Apache-2.0, stock voice), none (captions only)
#   voice_mode: clone | stock | none
#   fallback_engine: used when the primary engine fails QA or is unavailable
# IndicF5 is NOT used: commercial licence UNCLEAR (feasibility B1). Owner may opt in later.
# number_format: western (1,234,567) | indian (12,34,567; lakh/crore) | arabic_western (Arabic text, Western digits)
languages:
  - code: en
    name: English
    script: Latin
    tts_engine: chatterbox
    voice_mode: clone
    fallback_engine: kokoro
    number_format: western
    currency: USD
    captions: true
    dub: false          # master track
    priority: 1
  - code: hi
    name: Hindi
    script: Devanagari
    tts_engine: chatterbox
    voice_mode: clone
    fallback_engine: indic_parler
    number_format: indian
    currency: INR
    captions: true
    dub: true
    priority: 2
