# 13 languages. Source of truth for translator, TTS adapters, captions and dubbing.
# TTS verdicts from docs/feasibility.md (verified 2026-11-08).
#   tts_engine: chatterbox (MIT, voice clone), indic_parler (Apache-2.0, stock voice),
#               kokoro (Apache-2.0, stock voice), none (captions only)
#   voice_mode: clone | stock | none
#   fallback_engine: used when the primary engine fails QA or is unavailable
# IndicF5 is NOT used: commercial licence UNCLEAR (feasibility B1). Owner may opt in later.
# number_format: western (1,234,567) | indian (12,34,567; lakh/crore) | arabic_western (Arabic text, Western digits)
# Voice settings (WP11). voice_defaults apply to every language; a language entry may override any key.
#   accent: native | mine   native = target-language prosody (Chatterbox cfg_weight forced to 0 for non-English
#                           targets, per upstream README); mine = keep the reference speaker's accent
#   ref_clip: 1..3          which of the three selected reference clips (voice/clips/clipN.wav) to clone
#   speakers / speaker      Indic Parler recommended speakers (model card) and the chosen index
#   exaggeration, temperature, cfg_weight   Chatterbox sampling, tuned for calm narration
# Owner choices are applied with: uv run ullaslab voice apply-choices <choices.json>
voice_defaults:
  accent: native
  ref_clip: 1
  speaker: 0
  exaggeration: 0.4
  temperature: 0.7
  cfg_weight: 0.5
languages:
  - code: en
    name: English
    script: Latin
    tts_engine: chatterbox
    voice_mode: clone
    fallback_engine: kokoro
    number_format: western
    currency: USD
    captions: true
    dub: false          # master track
    priority: 1
    accent: mine
    ref_clip: 1
  - code: hi
    name: Hindi
    script: Devanagari
    tts_engine: chatterbox
    voice_mode: clone
    fallback_engine: indic_parler
    number_format: indian
    currency: INR
    captions: true
    dub: true
    priority: 2
    accent: native
    ref_clip: 1
    speakers: [Rohit, Divya]
    speaker: 0
