# Render engine. Public repo: no content, no voice, no URLs in this file or its logs. Triggered by repository_dispatch from the
# private content repo (every input and output is a presigned R2 URL inside the dispatch payload), or by hand
# (workflow_dispatch) with the synthetic, public-safe fixture item for a proof run that uploads nothing.
# Hard rules (enforced by tests/test_workflows.py): permissions {}, no pull_request trigger, URLs masked first, no artifact
# upload, no payload echo, the studio steps write their output to a private log (uploaded by presigned PUT, never printed),
# and the only secret is the stock-footage search key, given to the studio step alone.
# WP8: the master job renders the V2 studio item (scenes.json, styles, per-scene cache, cloned voice, studio QC).
name: render

on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
    inputs:
      fixture:
        description: "Synthetic public-safe studio item (generic text, stock reference voice, generated footage); nothing is uploaded"
        type: choice
        options: [studio-short]
        default: studio-short

permissions: {}

concurrency:
  group: render-${{ github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

env:
  UV_PYTHON: "3.12"
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  FIXTURE: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_dubs: ${{ steps.plan.outputs.has_dubs }}
      master_extras: ${{ steps.plan.outputs.master_extras }}
    steps:
      - name: Mask payload URLs
        run: |
          set +x
          jq -r '.client_payload // {} | [.bundle_url, .voice_url, .timing_url, .music_url, ((.voice_clip_urls // {}) | .[]), ((.outputs // {}) | .[]), (.model.url // empty), ((.studio.music_urls // {}) | .[])] | .[] | select(. != null)' "$GITHUB_EVENT_PATH" |
          while IFS= read -r u; do
            echo "::add-mask::$u"
            q="${u#*\?}"; [ "$q" != "$u" ] && echo "::add-mask::$q"
            p="${u#*://*/}"; p="${p%%\?*}"; [ -n "$p" ] && echo "::add-mask::$p"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate payload and plan matrix
        id: plan
        run: |
          uv sync --no-dev --frozen
          if [ "$FIXTURE" = true ]; then
            uv run --no-sync python -m ullaslab_engine plan --fixture >> "$GITHUB_OUTPUT"
          else
            uv run --no-sync python -m ullaslab_engine plan --payload "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
          fi

  master:
    needs: plan
    runs-on: ubuntu-24.04
    # The whole render (master, then the dub matrix) must finish inside the private repo's 3 h poll window and the presigned
    # URL lifetime (3 h 15 min): master 125 min + dub 50 min.
    timeout-minutes: 125
    permissions: {}
    steps:
      - name: Mask payload URLs
        run: |
          set +x
          jq -r '.client_payload // {} | [.bundle_url, .voice_url, .timing_url, .music_url, ((.voice_clip_urls // {}) | .[]), ((.outputs // {}) | .[]), (.model.url // empty), ((.studio.music_urls // {}) | .[])] | .[] | select(. != null)' "$GITHUB_EVENT_PATH" |
          while IFS= read -r u; do
            echo "::add-mask::$u"
            q="${u#*\?}"; [ "$q" != "$u" ] && echo "::add-mask::$q"
            p="${u#*://*/}"; p="${p%%\?*}"; [ -n "$p" ] && echo "::add-mask::$p"
          done
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: System packages (ffmpeg, headless Chrome libraries, espeak-ng)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 espeak-ng
          ffmpeg -hide_banner -version | head -1
      # Model weights only (Chatterbox, Kokoro, faster-whisper large-v3; MIT / Apache-2.0). Never item files, voices or footage.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-studio-v1-${{ hashFiles('uv.lock') }}
      - name: Install
        env:
          EXTRAS: ${{ needs.plan.outputs.master_extras }}
        run: |
          set -euo pipefail
          args=()
          for e in ${EXTRAS//,/ } asr; do [ "$e" = parler ] || args+=(--extra "$e"); done
          uv sync --frozen "${args[@]}"
          # spaCy English model for the Kokoro stock voice (fallback engine and the fixture's reference); pinned, sha256 checked
          whl=en_core_web_sm-3.8.0-py3-none-any.whl
          curl -fsSL -o "$RUNNER_TEMP/$whl" "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/$whl"
          echo "1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85  $RUNNER_TEMP/$whl" | sha256sum -c --quiet -
          uv pip install --no-deps "$RUNNER_TEMP/$whl"
          (cd remotion && npm ci --no-audit --no-fund)
          mkdir -p work/logs
      - name: Fetch bundle, voice reference and music (they stay on the runner)
        if: github.event_name == 'repository_dispatch'
        run: |
          uv run --no-sync python -m ullaslab_engine fetch --payload "$GITHUB_EVENT_PATH" --work work --voice --music --studio
          uv run --no-sync python -m ullaslab_engine studio-prepare --work work
      - name: Synthetic fixture item (proof run, public-safe)
        if: github.event_name == 'workflow_dispatch'
        run: uv run --no-sync python -m ullaslab_engine studio-fixture --work work
      - name: Voice (narration per output; output goes to the private log only)
        run: |
          set +e
          uv run --no-sync python -m ullaslab_engine studio-voice --work work >> work/logs/studio.log 2>&1
          rc=$?
          echo "voice exit $rc"
          if [ "$FIXTURE" = true ]; then tail -n 40 work/logs/studio.log; fi
          exit $rc
      - name: Studio render (studio run; output goes to the private log only)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set +e
          uv run --no-sync python -m ullaslab_engine studio run work/item --asr faster >> work/logs/studio.log 2>&1
          rc=$?
          echo "$rc" > work/studio_rc
          echo "studio run exit $rc (1 = QC FAIL or a stage error; the gates below say which)"
          grep -E '^\[(timings|broll|assemble|render|mix|package|qc)\] (running|skipped)' work/logs/studio.log || true
          if [ "$FIXTURE" = true ]; then tail -n 60 work/logs/studio.log; fi
      - name: QA gates (fails the job on breach)
        id: qa
        if: always()
        run: uv run --no-sync python -m ullaslab_engine studio-export --work work
      - name: Story (WP14, best effort; the optional music bed stays on the runner)
        if: github.event_name == 'repository_dispatch'
        continue-on-error: true
        run: uv run --no-sync python -m ullaslab_engine story --work work --lang en
      - name: Upload outputs
        if: always() && github.event_name == 'repository_dispatch'
        run: uv run --no-sync python -m ullaslab_engine upload --payload "$GITHUB_EVENT_PATH" --work work --lang en
      - name: Fixture summary (numbers only; nothing is uploaded)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          cat work/voice_stats.json || true
          for f in work/en/master/video.mp4 work/en/studio/studio_reel.mp4; do
            [ -f "$f" ] && ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$f"
          done
          ls -la work/en work/en/studio || true

  dub:
    needs: [plan, master]
    if: needs.plan.outputs.has_dubs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions: {}
    env:
      LANG_CODE: ${{ matrix.lang }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Mask payload URLs
        run: |
          set +x
          jq -r '.client_payload // {} | [.bundle_url, .voice_url, .timing_url, .music_url, ((.voice_clip_urls // {}) | .[]), ((.outputs // {}) | .[]), (.model.url // empty), ((.studio.music_urls // {}) | .[])] | .[] | select(. != null)' "$GITHUB_EVENT_PATH" |
          while IFS= read -r u; do
            echo "::add-mask::$u"
            q="${u#*\?}"; [ "$q" != "$u" ] && echo "::add-mask::$q"
            p="${u#*://*/}"; p="${p%%\?*}"; [ -n "$p" ] && echo "::add-mask::$p"
          done
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: System packages for headless Chrome and espeak
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 espeak-ng git-lfs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.lang }}-v1-${{ hashFiles('uv.lock') }}
      - name: Install
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          args=(); parler=0
          for e in ${EXTRAS//,/ } asr; do if [ "$e" = parler ]; then parler=1; else args+=(--extra "$e"); fi; done
          uv sync --frozen "${args[@]}"
          if [ "$parler" = 1 ]; then bash scripts/install_parler.sh; fi
          (cd remotion && npm ci --no-audit --no-fund)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: contains(matrix.extras, 'parler') && github.event.client_payload.model.revision != ''
        with:
          path: ~/.cache/ullaslab-parler
          key: parler-model-v1-${{ github.event.client_payload.model.revision }}
      - name: Parler weights (private R2 mirror, sha256 verified; downloads only on a cache miss)
        id: model
        if: contains(matrix.extras, 'parler')
        run: uv run --no-sync python -m ullaslab_engine fetch-model --payload "$GITHUB_EVENT_PATH" --dest "$HOME/.cache/ullaslab-parler" >> "$GITHUB_OUTPUT"
      - name: Fetch bundle, voice sample and master timing
        run: uv run --no-sync python -m ullaslab_engine fetch --payload "$GITHUB_EVENT_PATH" --work work --voice --timing --music
      - name: TTS (voice clone or stock voice per languages.yaml)
        id: tts
        env:
          PARLER_HUB: ${{ steps.model.outputs.hub }}
        run: |
          set -euo pipefail
          # Parler loads only from the verified mirror: own hub cache, offline, no Hugging Face access
          if [ -n "${PARLER_HUB:-}" ]; then export HF_HUB_CACHE="$PARLER_HUB" HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1; fi
          uv run --no-sync python -m ullaslab_engine tts --work work --lang "$LANG_CODE" > tts.log
          out=$(tail -1 tts.log)
          case "$out" in voice|captions-only) ;; *) echo "unexpected tts result"; exit 1;; esac
          echo "mode=$out" >> "$GITHUB_OUTPUT"
      - name: Captions (translated, timed from segment mapping)
        run: uv run --no-sync python -m ullaslab_engine captions --work work --lang "$LANG_CODE" --no-asr
      - name: QA dubbed audio track (fails the job on breach)
        if: steps.tts.outputs.mode == 'voice'
        run: uv run --no-sync python -m ullaslab_engine qa --work work --lang "$LANG_CODE"
      - name: Visual variants (for example the Hindi vertical cut) and their QA
        if: steps.tts.outputs.mode == 'voice'
        run: |
          for v in $(uv run --no-sync python -m ullaslab_engine variants --work work --lang "$LANG_CODE"); do
            uv run --no-sync python -m ullaslab_engine render --work work --variant "$v"
            uv run --no-sync python -m ullaslab_engine qa --work work --lang "$LANG_CODE" --variant "$v"
          done
      - name: Story (WP14, best effort; only languages with story text)
        continue-on-error: true
        run: uv run --no-sync python -m ullaslab_engine story --work work --lang "$LANG_CODE"
      - name: Upload outputs
        if: always()
        run: uv run --no-sync python -m ullaslab_engine upload --payload "$GITHUB_EVENT_PATH" --work work --lang "$LANG_CODE"
