# Render engine. Public repo, no secrets, no content. Triggered only by repository_dispatch from the
# private content repo; every input and output is a presigned R2 URL inside the dispatch payload.
# Hard rules (enforced by tests/test_workflows.py): permissions {}, no pull_request trigger, URLs masked
# first, no artifact upload, no payload echo.
name: render

on:
  repository_dispatch:
    types: [render]

permissions: {}

concurrency:
  group: render-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

env:
  UV_PYTHON: "3.12"
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_dubs: ${{ steps.plan.outputs.has_dubs }}
      master_extras: ${{ steps.plan.outputs.master_extras }}
    steps:
      - name: Mask payload URLs
        run: |
          set +x
          jq -r '.client_payload | [.bundle_url, .voice_url, .timing_url, ((.voice_clip_urls // {}) | .[]), ((.outputs // {}) | .[])] | .[] | select(. != null)' "$GITHUB_EVENT_PATH" |
          while IFS= read -r u; do
            echo "::add-mask::$u"
            q="${u#*\?}"; [ "$q" != "$u" ] && echo "::add-mask::$q"
            p="${u#*://*/}"; p="${p%%\?*}"; [ -n "$p" ] && echo "::add-mask::$p"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate payload and plan matrix
        id: plan
        run: |
          uv sync --no-dev --frozen
          uv run --no-sync python -m ullaslab_engine plan --payload "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  master:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {}
    steps:
      - name: Mask payload URLs
        run: |
          set +x
          jq -r '.client_payload | [.bundle_url, .voice_url, .timing_url, ((.voice_clip_urls // {}) | .[]), ((.outputs // {}) | .[])] | .[] | select(. != null)' "$GITHUB_EVENT_PATH" |
          while IFS= read -r u; do
            echo "::add-mask::$u"
            q="${u#*\?}"; [ "$q" != "$u" ] && echo "::add-mask::$q"
            p="${u#*://*/}"; p="${p%%\?*}"; [ -n "$p" ] && echo "::add-mask::$p"
          done
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: System packages for headless Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 espeak-ng git-lfs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-master-v1-${{ hashFiles('uv.lock') }}
      - name: Install
        env:
          EXTRAS: ${{ needs.plan.outputs.master_extras }}
        run: |
          args=""; parler=0
          for e in ${EXTRAS//,/ } asr; do if [ "$e" = parler ]; then parler=1; else args="$args --extra $e"; fi; done
          uv sync --frozen $args
          if [ "$parler" = 1 ]; then bash scripts/install_parler.sh; fi
          (cd remotion && npm ci --no-audit --no-fund)
      - name: Fetch bundle (voice sample stays on the runner)
        run: uv run --no-sync python -m ullaslab_engine fetch --payload "$GITHUB_EVENT_PATH" --work work --voice
      - name: TTS (English master)
        run: uv run --no-sync python -m ullaslab_engine tts --work work --lang en
      - name: Captions
        run: uv run --no-sync python -m ullaslab_engine captions --work work --lang en
      - name: Render master
        run: uv run --no-sync python -m ullaslab_engine render --work work
      - name: QA gates (fails the job on breach)
        id: qa
        run: uv run --no-sync python -m ullaslab_engine qa --work work --lang en
      - name: Upload outputs
        if: always()
        run: uv run --no-sync python -m ullaslab_engine upload --payload "$GITHUB_EVENT_PATH" --work work --lang en

  dub:
    needs: [plan, master]
    if: needs.plan.outputs.has_dubs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions: {}
    env:
      LANG_CODE: ${{ matrix.lang }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Mask payload URLs
        run: |
          set +x
          jq -r '.client_payload | [.bundle_url, .voice_url, .timing_url, ((.voice_clip_urls // {}) | .[]), ((.outputs // {}) | .[])] | .[] | select(. != null)' "$GITHUB_EVENT_PATH" |
          while IFS= read -r u; do
            echo "::add-mask::$u"
            q="${u#*\?}"; [ "$q" != "$u" ] && echo "::add-mask::$q"
            p="${u#*://*/}"; p="${p%%\?*}"; [ -n "$p" ] && echo "::add-mask::$p"
          done
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: System packages for headless Chrome and espeak
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 espeak-ng git-lfs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.lang }}-v1-${{ hashFiles('uv.lock') }}
      - name: Install
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          args=""; parler=0
          for e in ${EXTRAS//,/ } asr; do if [ "$e" = parler ]; then parler=1; else args="$args --extra $e"; fi; done
          uv sync --frozen $args
          if [ "$parler" = 1 ]; then bash scripts/install_parler.sh; fi
          (cd remotion && npm ci --no-audit --no-fund)
      - name: Fetch bundle, voice sample and master timing
        run: uv run --no-sync python -m ullaslab_engine fetch --payload "$GITHUB_EVENT_PATH" --work work --voice --timing
      - name: TTS (voice clone or stock voice per languages.yaml)
        id: tts
        run: |
          set -euo pipefail
          uv run --no-sync python -m ullaslab_engine tts --work work --lang "$LANG_CODE" > tts.log
          out=$(tail -1 tts.log)
          case "$out" in voice|captions-only) ;; *) echo "unexpected tts result"; exit 1;; esac
          echo "mode=$out" >> "$GITHUB_OUTPUT"
      - name: Captions (translated, timed from segment mapping)
        run: uv run --no-sync python -m ullaslab_engine captions --work work --lang "$LANG_CODE" --no-asr
      - name: QA dubbed audio track (fails the job on breach)
        if: steps.tts.outputs.mode == 'voice'
        run: uv run --no-sync python -m ullaslab_engine qa --work work --lang "$LANG_CODE"
      - name: Visual variants (for example the Hindi vertical cut) and their QA
        if: steps.tts.outputs.mode == 'voice'
        run: |
          for v in $(uv run --no-sync python -m ullaslab_engine variants --work work --lang "$LANG_CODE"); do
            uv run --no-sync python -m ullaslab_engine render --work work --variant "$v"
            uv run --no-sync python -m ullaslab_engine qa --work work --lang "$LANG_CODE" --variant "$v"
          done
      - name: Upload outputs
        if: always()
        run: uv run --no-sync python -m ullaslab_engine upload --payload "$GITHUB_EVENT_PATH" --work work --lang "$LANG_CODE"
