[project]
name = "ullaslab-engine"
version = "0.1.0"
description = "Secret-free render, TTS, captions and QA engine for the UllasLab content pipeline"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "pyyaml>=6",
  "requests>=2.31",
  "jsonschema>=4.20",
  "jiwer>=3.0",
  "pillow>=10",  # HPND; QC contact sheets
  "num2words>=0.5.13",  # LGPL-2.1, used unmodified via import (number verbalisation)
]

[project.optional-dependencies]
# Indic Parler-TTS is installed by scripts/install_parler.sh (git dependency pinned to a commit, needs git-lfs,
# and pins transformers 4.46, which conflicts with chatterbox-tts 0.1.7: never in the same job).
# Heavy engines are extras so each CI matrix job installs only what its language needs.
kokoro = ["kokoro>=0.9.4", "misaki[en]>=0.9.4"]
# setuptools<81: resemble-perth (watermarker) imports pkg_resources, removed in setuptools 81; without it chatterbox fails to load
chatterbox = ["chatterbox-tts==0.1.7", "setuptools>=69,<81"]
asr = ["faster-whisper>=1.1.0"]
asr-mlx = ["mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'"]  # local word timings (large-v3-turbo); CI/Linux use faster-whisper
rank = ["open_clip_torch>=2.24", "torch>=2.2", "pillow>=10"]  # B-roll CLIP ranking (CPU); fallback keyword ranker without it
dev = ["pytest>=8"]

[project.scripts]
ullaslab-engine = "ullaslab_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ullaslab_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

